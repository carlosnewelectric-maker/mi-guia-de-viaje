<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Guía">
<title>Mi Guía de Viaje</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --verde:#0f5c4d; --verde2:#e7f2ef; --tinta:#1d2421; --gris:#5f6b66; --linea:#dde3e0;
    --fondo:#ffffff; --sombra:0 6px 24px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:#f4f6f5}
  #mapa{position:fixed;inset:0;z-index:1}
  /* Barra superior */
  .barra{position:fixed;z-index:1000;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;display:flex;gap:8px;pointer-events:none}
  .barra form{flex:1;display:flex;pointer-events:auto;background:var(--fondo);border-radius:14px;box-shadow:var(--sombra);overflow:hidden}
  .barra input{flex:1;border:0;padding:13px 14px;font-size:16px;outline:none;min-width:0}
  .barra button{border:0;background:var(--verde);color:#fff;padding:0 16px;font-size:15px;font-weight:600}
  .boton-redondo{pointer-events:auto;width:48px;height:48px;border-radius:14px;border:0;background:var(--fondo);box-shadow:var(--sombra);font-size:22px;display:flex;align-items:center;justify-content:center}
  /* Panel inferior */
  .panel{position:fixed;z-index:1000;left:0;right:0;bottom:0;background:var(--fondo);border-radius:20px 20px 0 0;box-shadow:var(--sombra);
         max-height:62vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);transition:max-height .25s}
  .panel.min{max-height:118px}
  .asa{width:44px;height:5px;border-radius:3px;background:#c9d1cd;margin:8px auto 4px;flex:none}
  .pestanas{display:flex;gap:6px;padding:4px 12px 8px;flex:none}
  .pestanas button{flex:1;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--gris)}
  .pestanas button.activa{background:var(--verde);border-color:var(--verde);color:#fff}
  .contenido{overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
  .estado{color:var(--gris);font-size:14px;padding:6px 2px}
  /* Lista de sitios */
  .sitio{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
  .sitio img,.sitio .sinfoto{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;background:var(--verde2)}
  .sitio .sinfoto{display:flex;align-items:center;justify-content:center;font-size:24px}
  .sitio b{display:block;font-size:15px}
  .sitio small{color:var(--gris);font-size:13px}
  .etq{display:inline-block;font-size:11px;font-weight:700;background:#fff3d6;color:#7a5500;border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:middle}
  /* Ficha */
  .ficha h2{margin:4px 0 2px;font-size:21px}
  .ficha .desc{color:var(--gris);margin:0 0 10px;font-size:14px}
  .ficha img.foto{width:100%;max-height:240px;object-fit:cover;border-radius:14px;background:var(--verde2)}
  .ficha p{line-height:1.5;font-size:15px}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .acciones a,.acciones button{flex:1;min-width:130px;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px;font-weight:600;font-size:14px}
  .primario{background:var(--verde);color:#fff}
  .secundario{background:var(--verde2);color:var(--verde)}
  .volver{border:0;background:none;color:var(--verde);font-weight:600;font-size:15px;padding:6px 0}
  /* Tiempo */
  .ahora{display:flex;align-items:center;gap:14px;padding:6px 0 12px}
  .ahora .ico{font-size:46px}
  .ahora .temp{font-size:34px;font-weight:700}
  .dia{display:grid;grid-template-columns:92px 34px 1fr auto;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--linea);font-size:15px}
  .dia .ll{color:#2b6cb0;font-size:13px}
  .nota{font-size:12px;color:var(--gris);margin-top:10px}
  .leaflet-popup-content{margin:10px 12px;font-size:14px}
  /* Vista de día con fotos */
  .diacab h2{margin:2px 0;font-size:20px}
  .diacab .desc{color:var(--gris);font-size:14px;margin-bottom:8px}
  .pdia{border-radius:16px;overflow:hidden;border:1px solid var(--linea);margin:10px 0;cursor:pointer;background:#fff}
  .pdia .img{position:relative;height:170px;background:var(--verde2);display:flex;align-items:center;justify-content:center;font-size:44px}
  .pdia .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pdia .num{position:absolute;left:10px;top:10px;z-index:2;background:var(--verde);color:#fff;font-weight:700;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-size:15px}
  .pdia .txt{padding:10px 12px}
  .pdia .txt b{font-size:16px}
  .pdia .txt .h{color:var(--verde);font-weight:700;margin-right:6px}
  .pdia .txt p{margin:4px 0 0;color:var(--gris);font-size:14px;line-height:1.4}
  .pin{background:var(--verde);color:#fff;font-weight:700;font-size:13px;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .avisoGPS{position:fixed;z-index:1100;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 70px);background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:14px;border:2px solid var(--verde)}
  .avisoGPS b{font-size:17px}
  .avisoGPS .acciones a,.avisoGPS .acciones button{min-width:0}
  .gpsest{font-size:12px;color:var(--gris);margin:2px 0 6px}
  .pinN{color:#fff;font-weight:700;font-size:12px;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .pinIni{background:#fff;border:2px solid var(--verde);border-radius:14px;padding:2px 7px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .selIni{display:flex;gap:6px;align-items:center;margin:2px 0 8px;font-size:13px;color:var(--gris)}
  .selIni button{border:1px solid var(--linea);background:#fff;border-radius:16px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--gris)}
  .selIni button.activa{background:var(--verde);border-color:var(--verde);color:#fff}
  .sitio .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .dia.clic{cursor:pointer}
  .dia.sel{background:var(--verde2);border-radius:10px}
  .horas{border:1px solid var(--linea);border-radius:12px;padding:8px 10px;margin:6px 0 10px;background:#fff}
  .horas .res{font-size:14px;line-height:1.45;margin:2px 0 8px}
  .hora{display:grid;grid-template-columns:48px 28px 46px 1fr 62px;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--linea);font-size:14px}
  .hora .barra{height:8px;border-radius:4px;background:#e3ecf7;overflow:hidden}
  .hora .barra i{display:block;height:100%;background:#2b6cb0}
  .hora.lluvia{background:#eef4fc}
  .yo{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35)}
</style>
</head>
<body>
<div id="mapa"></div>

<div class="barra">
  <form id="buscador" autocomplete="off">
    <input id="q" type="search" placeholder="Buscar ciudad o lugar…" enterkeyhint="search">
    <button type="submit">Ir</button>
  </form>
  <button class="boton-redondo" id="btnYo" title="Cerca de mí" aria-label="Cerca de mí">📍</button>
</div>

<div class="avisoGPS" id="avisoGPS" style="display:none"></div>
<div class="panel" id="panel">
  <div class="asa" id="asa"></div>
  <div class="pestanas">
    <button data-p="sitios" class="activa">🏛️ Sitios</button>
    <button data-p="tiempo">⛅ Tiempo</button>
  </div>
  <div class="contenido" id="contenido"><div class="estado">Pulsa 📍 para ver qué hay cerca de ti, o busca un destino.</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ===== Mi Guía de Viaje — Guía (mapa, sitios, fichas, tiempo) =====
   Fuentes gratuitas: OpenStreetMap (mapa y buscador), Wikipedia (sitios y fichas), Open-Meteo (tiempo).
   Enlaces admitidos:  ?lat=35.01&lon=135.76   ?q=Kioto   ?t=Kinkaku-ji (abre la ficha)            */

const RADIO = 10000;           // metros alrededor del punto para buscar sitios
const MAX_SITIOS = 50;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const mapa = L.map("mapa", {zoomControl:false}).setView([40.4168, -3.7038], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap"
}).addTo(mapa);
const capaSitios = L.layerGroup().addTo(mapa);
let marcaYo = null, centro = null, sitios = [], pestana = "sitios", vista = "lista", fichaActual = null;

const $contenido = document.getElementById("contenido");
const $panel = document.getElementById("panel");

/* ---------- utilidades ---------- */
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function distancia(a, b){ // km
  const R = 6371, rad = x => x*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLon = rad(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = km => km < 1 ? Math.round(km*1000) + " m" : km.toFixed(1).replace(".", ",") + " km";
function estado(txt){ $contenido.innerHTML = `<div class="estado">${esc(txt)}</div>`; }
function abrirPanel(){ $panel.classList.remove("min"); }

/* ---------- pestañas y panel ---------- */
document.querySelectorAll(".pestanas button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".pestanas button").forEach(x => x.classList.toggle("activa", x === b));
  pestana = b.dataset.p; abrirPanel(); pintar();
});
document.getElementById("asa").onclick = () => $panel.classList.toggle("min");

function pintar(){
  if(pestana === "tiempo") return pintarTiempo();
  if(vista === "dia" && diaVista) return pintarDia();
  if(vista === "ficha" && fichaActual) return pintarFicha(fichaActual);
  pintarLista();
}

/* ---------- ubicación ---------- */
/* Localización: centra el mapa en ti, busca sitios cercanos y mantiene el punto azul actualizado */
let vigilaYo = null, ultimaBusqueda = null;
function ponerPuntoYo(pos, precision){
  if(marcaYo) marcaYo.setLatLng([pos.lat, pos.lon]);
  else marcaYo = L.marker([pos.lat, pos.lon], {icon: L.divIcon({className:"", html:'<div class="yo"></div>', iconSize:[18,18]}), zIndexOffset: 1000}).addTo(mapa).bindTooltip("Estás aquí");
}
const AYUDA_PERMISO = "No hay permiso de ubicación. En iPhone: Ajustes › Privacidad y seguridad › Localización › activa la localización y permite el acceso a Safari (o a la app desde la que abriste la Guía: «Al usar la app»). Después recarga esta página.";
function localizarme(respaldo){
  if(!navigator.geolocation){ estado("Este navegador no permite obtener la ubicación."); return; }
  estado("📡 Buscando tu ubicación por GPS…"); abrirPanel();
  let primera = true;
  const ok = p => {
    const pos = {lat: p.coords.latitude, lon: p.coords.longitude};
    ponerPuntoYo(pos, p.coords.accuracy); posYo = pos;
    if(primera){ primera = false; ultimaBusqueda = pos; modoInicio = "yo"; irA(pos, 15); return; }
    // al caminar: el punto azul se mueve; si te alejas más de 400 m se actualizan los sitios cercanos
    if(!diaVista && vista === "lista" && pestana === "sitios" && distancia(pos, ultimaBusqueda) > 0.4){ ultimaBusqueda = pos; centro = pos; cargarSitios(pos); }
  };
  const ko = err => {
    if(!primera) return;
    const msg = err.code === 1 ? AYUDA_PERMISO : "No se pudo obtener la señal GPS. Sal a un lugar abierto o vuelve a pulsar 📍.";
    if(respaldo){ irA(respaldo, 15); setTimeout(() => { $contenido.insertAdjacentHTML("afterbegin", `<div class="estado" style="background:#fff3d6;border-radius:10px;padding:8px;margin-bottom:6px">⚠️ ${esc(msg)}<br>Mostrando la última posición conocida${respaldo.nombre ? ": " + esc(respaldo.nombre) : ""}.</div>`); }, 1200); }
    else estado("⚠️ " + msg);
  };
  if(vigilaYo != null) navigator.geolocation.clearWatch(vigilaYo);
  vigilaYo = navigator.geolocation.watchPosition(ok, ko, {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
}
document.getElementById("btnYo").onclick = () => localizarme(null);

/* ---------- buscador (OpenStreetMap Nominatim) ---------- */
document.getElementById("buscador").onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if(!q) return;
  document.getElementById("q").blur();
  await buscarLugar(q);
};
/* estación principal de una ciudad (OpenStreetMap) */
async function buscarEstacion(ciudad, pos){
  const consultas = [`${ciudad} station`, `estación de ${ciudad}`, `${ciudad} 駅`];
  for(const c of consultas){
    try{
      const r = await getJSON("https://nominatim.openstreetmap.org/search?format=json&limit=8&accept-language=es&q=" + encodeURIComponent(c));
      const est = r.filter(x => (x.class === "railway" || x.type === "station" || x.type === "train_station" || /station|estaci/i.test(x.type || "")) && distancia(pos, {lat:+x.lat, lon:+x.lon}) < 15)
        .sort((a,b) => (+b.importance || 0) - (+a.importance || 0))[0];
      if(est) return {lat:+est.lat, lon:+est.lon, nombre: (est.name || est.display_name || "Estación").split(",")[0]};
    }catch(_){}
  }
  return null;
}
async function buscarLugar(q){
  estado("Buscando «" + q + "»…"); abrirPanel();
  try{
    const r = await getJSON("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q=" + encodeURIComponent(q));
    if(!r.length){ estado("No he encontrado «" + q + "». Prueba con otro nombre."); return; }
    const z = r[0].type === "city" || r[0].addresstype === "city" ? 13 : 14;
    const pos = {lat:+r[0].lat, lon:+r[0].lon};
    estacion = await buscarEstacion(r[0].name || q, pos);
    modoInicio = estacion ? "estacion" : "centro";
    irA(pos, z);
  }catch(err){ estado("Error al buscar. Comprueba la conexión."); }
}

/* Pulsación larga / clic en el mapa: buscar sitios en ese punto */
mapa.on("contextmenu", e => irA({lat:e.latlng.lat, lon:e.latlng.lng}, mapa.getZoom()));

function irA(pos, zoom){
  centro = pos;
  mapa.setView([pos.lat, pos.lon], zoom || 14);
  vista = "lista"; fichaActual = null;
  if(diaVista){ diaVista = null; capaDia.clearLayers(); $panel.style.maxHeight = ""; if(vigilancia != null){ navigator.geolocation.clearWatch(vigilancia); vigilancia = null; } cerrarAvisoGps(); }
  cargarSitios(pos);
  tiempoCache = null;
  if(pestana === "tiempo") pintarTiempo();
}

/* ---------- sitios cercanos (Wikipedia) ---------- */
async function geoWiki(lang, pos){
  const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*` +
    `&generator=geosearch&ggscoord=${pos.lat}|${pos.lon}&ggsradius=${RADIO}&ggslimit=${MAX_SITIOS}` +
    `&prop=coordinates|pageimages|description&piprop=thumbnail&pithumbsize=160&pilimit=${MAX_SITIOS}`;
  const d = await getJSON(url);
  return Object.values(d?.query?.pages || {}).filter(p => p.coordinates).map(p => ({
    titulo: p.title, lang,
    lat: p.coordinates[0].lat, lon: p.coordinates[0].lon,
    foto: p.thumbnail?.source || "", desc: p.description || ""
  }));
}
let estacion = null, modoInicio = "centro", posYo = null, busquedaId = 0;
async function cargarSitios(pos){
  const miBusqueda = ++busquedaId;
  if(pestana === "sitios") estado("Buscando sitios de interés cercanos…");
  capaSitios.clearLayers(); sitios = [];
  try{
    let lista = await geoWiki("es", pos);
    // Si en español hay pocos artículos (habitual fuera de países hispanos), se completa con inglés.
    if(lista.length < 12){
      try{
        const en = await geoWiki("en", pos);
        const cerca = (a,b) => distancia(a,b) < 0.08;
        en.forEach(x => { if(!lista.some(y => cerca(x,y))) lista.push(x); });
      }catch(_){}
    }
    await aEspanol(lista);
    if(miBusqueda !== busquedaId) return;                 // una búsqueda más reciente ya está en marcha
    lista.forEach(s => s.km = distancia(pos, s));
    lista.sort((a,b) => (b.foto ? 1:0) - (a.foto ? 1:0) || a.km - b.km);
    sitios = lista.slice(0, 60);
    ordenarYpintar();
    traducirDescripciones(sitios);
  }catch(err){
    if(miBusqueda !== busquedaId) return;
    if(pestana === "sitios") estado("No se pudieron cargar los sitios. Comprueba la conexión.");
  }
}
/* punto de inicio de la ruta */
function puntoInicio(){
  if(modoInicio === "estacion" && estacion) return {...estacion, icono:"🚉", etiqueta: estacion.nombre};
  if(modoInicio === "yo" && posYo) return {...posYo, icono:"📍", etiqueta:"Mi posición"};
  if(posYo) return {...posYo, icono:"📍", etiqueta:"Mi posición"};
  return centro ? {...centro, icono:"⭐", etiqueta:"Centro de la búsqueda"} : null;
}
/* orden de visita en cadena: cada sitio es el más próximo al anterior (ruta a pie sin ir y volver) */
function ordenarYpintar(){
  const ini = puntoInicio();
  capaSitios.clearLayers();
  if(!ini || !sitios.length){ if(pestana === "sitios" && vista === "lista") pintarLista(); return; }
  const pend = sitios.slice(), orden = [];
  let actual = ini;
  while(pend.length){
    let k = 0, dk = Infinity;
    pend.forEach((s, i) => { const d = distancia(actual, s); if(d < dk){ dk = d; k = i; } });
    const s = pend.splice(k, 1)[0]; s.paso = dk; s.km = distancia(ini, s); orden.push(s); actual = s;
  }
  sitios = orden;
  L.marker([ini.lat, ini.lon], {icon: L.divIcon({className:"", html:`<div class="pinIni">${ini.icono} Inicio</div>`, iconSize:null, iconAnchor:[30, 12]}), zIndexOffset: 900}).addTo(capaSitios).bindTooltip(ini.etiqueta);
  L.polyline([[ini.lat, ini.lon], ...sitios.map(s => [s.lat, s.lon])], {color:"#0f5c4d", weight:2, opacity:.5, dashArray:"5 6"}).addTo(capaSitios);
  sitios.forEach((s, i) => {
    L.marker([s.lat, s.lon], {icon: L.divIcon({className:"", html:`<div class="pinN" style="background:${s.lang === "es" ? "#0f5c4d" : "#c77d00"}">${i+1}</div>`, iconSize:[24,24], iconAnchor:[12,12]})})
      .addTo(capaSitios).bindTooltip(`${i+1}. ${s.titulo}`).on("click", () => abrirFicha(i));
  });
  // encuadre: inicio + los primeros sitios de la ruta, sin quedar tapados por el panel
  const pts = [[ini.lat, ini.lon], ...sitios.slice(0, 15).map(s => [s.lat, s.lon])];
  try{ mapa.fitBounds(pts, {paddingTopLeft:[30, 80], paddingBottomRight:[30, Math.round(window.innerHeight * 0.55)], maxZoom: 16}); }catch(_){}
  if(pestana === "sitios" && vista === "lista") pintarLista();
}
function pintarLista(){
  if(!centro){ estado("Pulsa 📍 para ver qué hay cerca de ti, o busca un destino."); return; }
  if(!sitios.length){ estado("No hay sitios con ficha en Wikipedia en esta zona. Prueba a buscar otro punto o mantén pulsado el mapa."); return; }
  const ini = puntoInicio();
  $contenido.innerHTML = `<div class="selIni">Empezar en:
      <button data-ini="estacion" class="${modoInicio === "estacion" && estacion ? "activa" : ""}" ${estacion ? "" : "disabled"}>🚉 ${esc(estacion ? estacion.nombre : "Estación")}</button>
      <button data-ini="yo" class="${ini && ini.icono === "📍" ? "activa" : ""}">📍 Mi posición</button></div>
    <div class="estado">${sitios.length} sitios en orden de ruta desde ${esc(ini ? ini.etiqueta : "el centro")} · <span style="color:#c77d00">●</span> = ficha traducida</div>` +
    sitios.map((s,i) => `
    <div class="sitio" data-i="${i}">
      <span class="num" style="background:${s.lang === "es" ? "#0f5c4d" : "#c77d00"}">${i+1}</span>
      ${s.foto ? `<img src="${esc(s.foto)}" alt="" loading="lazy">` : `<div class="sinfoto">🏛️</div>`}
      <div><b>${esc(s.titulo)}</b>
      <small>${s.paso != null ? (i === 0 ? "a " : "+") + fmtDist(s.paso) + (i === 0 ? " del inicio" : " desde el " + i) : fmtDist(s.km)}${s.desc ? " · " + esc(s.desc) : ""}</small></div>
    </div>`).join("");
  $contenido.querySelectorAll(".sitio").forEach(el => el.onclick = () => abrirFicha(+el.dataset.i));
  $contenido.querySelectorAll("[data-ini]").forEach(b => b.onclick = () => {
    if(b.dataset.ini === "estacion"){ modoInicio = "estacion"; ordenarYpintar(); return; }
    modoInicio = "yo";
    if(posYo) return ordenarYpintar();
    if(!navigator.geolocation) return;
    estado("📡 Buscando tu ubicación por GPS…");
    navigator.geolocation.getCurrentPosition(p => { posYo = {lat:p.coords.latitude, lon:p.coords.longitude}; ponerPuntoYo(posYo); ordenarYpintar(); },
      err => { pintarLista(); $contenido.insertAdjacentHTML("afterbegin", `<div class="estado" style="background:#fff3d6;border-radius:10px;padding:8px">⚠️ ${esc(err.code === 1 ? AYUDA_PERMISO : "No se pudo obtener la señal GPS.")}</div>`); },
      {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
  });
}

/* ---------- castellano: versión española de Wikipedia y traducción automática ---------- */
async function tituloEspanol(titulos){
  const res = {};
  for(let i = 0; i < titulos.length; i += 50){
    const lote = titulos.slice(i, i+50);
    const d = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=langlinks&lllang=es&lllimit=max&titles=${encodeURIComponent(lote.join("|"))}`);
    const mapa = {}; (d.query?.normalized || []).concat(d.query?.redirects || []).forEach(n => mapa[n.to] = n.from);
    Object.values(d.query?.pages || {}).forEach(pg => {
      const es = (pg.langlinks || [])[0]?.["*"];
      if(es){ res[pg.title] = es; if(mapa[pg.title]) res[mapa[pg.title]] = es; }
    });
  }
  return res;
}
/* sitios de la lista que solo estaban en inglés: si tienen artículo en español, se usa ese */
async function aEspanol(lista){
  const en = lista.filter(s => s.lang === "en");
  if(!en.length) return;
  try{
    const es = await tituloEspanol(en.map(s => s.titulo));
    en.forEach(s => { if(es[s.titulo]){ s.titulo = es[s.titulo]; s.lang = "es"; s.desc = ""; } });
  }catch(_){}
}
function leerCacheTr(){ try{ return JSON.parse(localStorage.getItem("mgv_tr") || "{}"); }catch(_){ return {}; } }
function guardarCacheTr(c){ try{ const k = Object.keys(c); if(k.length > 400) k.slice(0, k.length - 400).forEach(x => delete c[x]); localStorage.setItem("mgv_tr", JSON.stringify(c)); }catch(_){} }
let cuotaAgotada = false;
function trozos(texto, max){
  const frases = texto.match(/[^.!?]+[.!?]*\s*/g) || [texto], out = [];
  let act = "";
  const bytes = s => new TextEncoder().encode(s).length;
  frases.forEach(f => {
    if(bytes(act + f) <= max) act += f;
    else { if(act) out.push(act); while(bytes(f) > max){ let corte = f.slice(0, Math.floor(max/2)); out.push(corte); f = f.slice(corte.length); } act = f; }
  });
  if(act.trim()) out.push(act);
  return out;
}
async function traducir(texto){
  texto = String(texto || "").trim(); if(!texto) return "";
  const cache = leerCacheTr();
  if(cache[texto]) return cache[texto];
  if(cuotaAgotada) throw {cuota:true};
  const partes = [];
  for(const t of trozos(texto, 450)){
    const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|es&q=" + encodeURIComponent(t.trim()));
    const d = await r.json().catch(() => ({}));
    const tr = d?.responseData?.translatedText || "";
    if(d?.responseStatus == 429 || /MYMEMORY WARNING|QUOTA/i.test(tr)){ cuotaAgotada = true; throw {cuota:true}; }
    if(d?.responseStatus != 200 || !tr) throw {cuota:false};
    partes.push(tr.trim());
  }
  const res = partes.join(" ");
  cache[texto] = res; guardarCacheTr(cache);
  return res;
}
/* descripciones cortas en inglés de la lista: se traducen poco a poco (máx. 20 por zona) */
async function traducirDescripciones(lista){
  const pend = lista.filter(s => s.lang === "en" && s.desc && !s.descEs).slice(0, 20);
  for(const s of pend){
    try{ s.desc = await traducir(s.desc); s.descEs = true; }catch(e){ if(e && e.cuota) break; }
    if(sitios === lista && pestana === "sitios" && vista === "lista") pintarLista();
  }
}

async function mostrarFicha(titulo, lang, base){

  estado("Cargando ficha…");
  if(lang === "en"){ try{ const es = await tituloEspanol([titulo]); if(es[titulo]) return mostrarFicha(es[titulo], "es", base); }catch(_){} }
  try{
    let d = await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(titulo.replace(/ /g,"_"))}`);
    // Si se pidió en español y existe versión en español, se usa; si no, se intenta en inglés.
    fichaActual = {

      f.traduciendo = false;
      if(fichaActual === f && vista === "ficha") pintarFicha(f);

  }catch(err){
    if(lang === "es"){ return mostrarFicha(titulo, "en", base); }

}

/* ---------- vista de día con fotos (enlace desde el Planificador: ?dia=...) ---------- */
let diaVista = null;   // {d, t, x, p:[{hora,nombre,nota,lat,lon,wiki,foto}]}
const capaDia = L.layerGroup().addTo(mapa);
async function fotosWiki(lang, paradas){
  // Busca la foto principal de cada parada por su título de Wikipedia (o por su nombre si está cerca de sus coordenadas)
  const pend = paradas.filter(p => !p.foto && (p.wiki || p.nombre));
  if(!pend.length) return;
  const tit = [...new Set(pend.map(p => p.wiki || p.nombre))].slice(0, 50);
  const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1` +
    `&prop=pageimages|coordinates&piprop=thumbnail&pithumbsize=640&titles=${encodeURIComponent(tit.join("|"))}`;
  const d = await getJSON(url);
  const mapaTit = {};
  (d.query?.normalized || []).forEach(n => mapaTit[n.from] = n.to);
  (d.query?.redirects || []).forEach(n => mapaTit[n.from] = n.to);
  const real = t => { let x = t, i = 0; while(mapaTit[x] && i++ < 3) x = mapaTit[x]; return x; };
  const paginas = {};
  Object.values(d.query?.pages || {}).forEach(pg => { if(pg.pageid) paginas[pg.title] = pg; });
  pend.forEach(p => {
    const pg = paginas[real(p.wiki || p.nombre)];
    if(!pg || !pg.thumbnail) return;
    // Sin título de Wikipedia explícito, solo se acepta si el artículo está a menos de 3 km de la parada
    if(!p.wiki){
      if(p.lat == null || !pg.coordinates) return;
      if(distancia({lat:p.lat, lon:p.lon}, {lat:pg.coordinates[0].lat, lon:pg.coordinates[0].lon}) > 3) return;
    }
    p.foto = pg.thumbnail.source; p.lang = lang; p.wiki = p.wiki || pg.title;
  });
}

/* ---------- tiempo (Open-Meteo) ---------- */
const WMO = {0:["☀️","Despejado"],1:["🌤️","Casi despejado"],2:["⛅","Parcialmente nuboso"],3:["☁️","Nublado"],45:["🌫️","Niebla"],48:["🌫️","Niebla con escarcha"],
  51:["🌦️","Llovizna débil"],53:["🌦️","Llovizna"],55:["🌦️","Llovizna intensa"],56:["🌧️","Llovizna helada"],57:["🌧️","Llovizna helada"],
  61:["🌧️","Lluvia débil"],63:["🌧️","Lluvia"],65:["🌧️","Lluvia fuerte"],66:["🌧️","Lluvia helada"],67:["🌧️","Lluvia helada fuerte"],
  71:["🌨️","Nieve débil"],73:["🌨️","Nieve"],75:["❄️","Nieve fuerte"],77:["🌨️","Granizo fino"],80:["🌦️","Chubascos débiles"],81:["🌧️","Chubascos"],82:["⛈️","Chubascos fuertes"],
  85:["🌨️","Chubascos de nieve"],86:["❄️","Chubascos de nieve fuertes"],95:["⛈️","Tormenta"],96:["⛈️","Tormenta con granizo"],99:["⛈️","Tormenta con granizo"]};
const wmo = c => WMO[c] || ["🌡️","—"];
let tiempoCache = null;
async function pintarTiempo(){
  if(!centro){ estado("Busca un destino o pulsa 📍 para ver el tiempo."); return; }
  if(tiempoCache){ return dibujarTiempo(tiempoCache); }
  estado("Cargando el tiempo…");
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${centro.lat}&longitude=${centro.lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=16` +
      `&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m`;
    tiempoCache = await getJSON(u);
    if(pestana === "tiempo") dibujarTiempo(tiempoCache);
  }catch(err){ estado("No se pudo cargar el tiempo. Comprueba la conexión."); }
}
let diaTiempo = null, diaViaje = null, verDiasTiempo = 7;   // día desplegado; fecha del día del itinerario (si viene del Planificador)
function horasDe(d, fecha){
  const H = d.hourly; if(!H) return [];
  const out = [];
  H.time.forEach((t, i) => { if(t.slice(0,10) === fecha) out.push({h: t.slice(11,16), hh: +t.slice(11,13), temp: H.temperature_2m[i], prob: H.precipitation_probability?.[i], mm: H.precipitation?.[i], code: H.weather_code[i], viento: H.wind_speed_10m?.[i]}); });
  return out;
}
/* resumen en castellano: tramos de lluvia y mejores horas para pasear */
function resumenHoras(hs){
  const dia = hs.filter(x => x.hh >= 7 && x.hh <= 22);
  const llueve = x => (x.prob ?? 0) >= 50 || (x.mm ?? 0) >= 0.3;
  const tramos = []; let act = null;
  dia.forEach(x => { if(llueve(x)){ if(!act) act = {ini:x.hh, fin:x.hh, max:x.prob ?? 0, mm:0}; act.fin = x.hh; act.max = Math.max(act.max, x.prob ?? 0); act.mm += x.mm ?? 0; } else if(act){ tramos.push(act); act = null; } });
  if(act) tramos.push(act);
  let mejor = null, cur = null;
  dia.filter(x => x.hh >= 8 && x.hh <= 21).forEach(x => { if((x.prob ?? 0) < 30 && (x.mm ?? 0) < 0.1){ if(!cur) cur = {ini:x.hh, fin:x.hh}; cur.fin = x.hh; if(!mejor || cur.fin - cur.ini > mejor.fin - mejor.ini) mejor = {...cur}; } else cur = null; });
  const hh = n => String(n).padStart(2,"0") + ":00";
  let txt = tramos.length ? tramos.map(t => `🌧️ Lluvia probable de ${hh(t.ini)} a ${hh(t.fin + 1)} (hasta ${t.max} %${t.mm >= 0.1 ? `, unos ${t.mm.toFixed(1).replace(".", ",")} mm` : ""})`).join("<br>") : "☀️ Sin lluvia prevista durante el día.";
  if(mejor && tramos.length) txt += `<br>👟 Mejores horas para pasear: ${hh(mejor.ini)}–${hh(mejor.fin + 1)}.`;
  const max = Math.max(...dia.map(x => x.temp)), min = Math.min(...dia.map(x => x.temp));
  if(isFinite(max)) txt += `<br>🌡️ Entre ${Math.round(min)}° y ${Math.round(max)}° (de 7:00 a 22:00).`;
  return txt;
}
function htmlHoras(d, fecha){
  const ahora = d.current?.time ? d.current.time.slice(0,13) : "";
  let hs = horasDe(d, fecha).filter(x => x.hh >= 6);
  if(fecha === (d.current?.time || "").slice(0,10)) hs = hs.filter(x => (fecha + "T" + x.h).slice(0,13) >= ahora);
  if(!hs.length) return `<div class="horas"><div class="estado">No hay datos por horas para este día.</div></div>`;
  return `<div class="horas"><div class="res">${resumenHoras(horasDe(d, fecha))}</div>
    ${hs.map(x => { const [i] = wmo(x.code), p = x.prob ?? 0;
      return `<div class="hora ${p >= 50 ? "lluvia" : ""}"><b>${x.h}</b><span>${i}</span><span>${Math.round(x.temp)}°</span>
        <span title="Probabilidad de lluvia"><span class="barra"><i style="width:${p}%"></i></span><span class="ll">💧${p}%${(x.mm ?? 0) >= 0.1 ? " · " + x.mm.toFixed(1).replace(".", ",") + " mm" : ""}</span></span>
        <span class="estado" style="padding:0;font-size:12px">💨 ${Math.round(x.viento ?? 0)} km/h</span></div>`; }).join("")}</div>`;
}
function dibujarTiempo(d){
  const c = d.current, [ico, txt] = wmo(c.weather_code);
  const fechas = d.daily.time;
  if(!diaTiempo || !fechas.includes(diaTiempo)) diaTiempo = (diaViaje && fechas.includes(diaViaje)) ? diaViaje : fechas[0];
  const fueraDeRango = diaViaje && !fechas.includes(diaViaje);
  const mostrar = Math.max(verDiasTiempo, fechas.indexOf(diaTiempo) + 1);
  const dias = fechas.slice(0, mostrar).map((t, i) => {
    const f = new Date(t + "T12:00:00");
    const nombre = i === 0 ? "Hoy" : i === 1 ? "Mañana" : f.toLocaleDateString("es-ES", {weekday:"short", day:"numeric"});
    const [di, dt] = wmo(d.daily.weather_code[i]);
    const ll = d.daily.precipitation_probability_max?.[i];
    const sel = t === diaTiempo;
    return `<div class="dia clic ${sel ? "sel" : ""}" data-f="${t}"><span>${sel ? "▾ " : "▸ "}${nombre}${t === diaViaje ? " 📍" : ""}</span><span>${di}</span><span>${dt}${ll != null ? ` <span class="ll">💧${ll}%</span>` : ""}</span>
      <b>${Math.round(d.daily.temperature_2m_max[i])}° / <span style="color:var(--gris)">${Math.round(d.daily.temperature_2m_min[i])}°</span></b></div>${sel ? htmlHoras(d, t) : ""}`;
  }).join("");
  $contenido.innerHTML = `
    ${fueraDeRango ? `<div class="estado" style="background:#fff3d6;border-radius:10px;padding:8px;margin-bottom:6px">📅 Vuestro día aquí es el ${new Date(diaViaje + "T12:00:00").toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"})}: la previsión por horas estará disponible unos 16 días antes.</div>` : ""}
    <div class="ahora"><span class="ico">${ico}</span><div><div class="temp">${Math.round(c.temperature_2m)}°C</div>
    <div class="estado" style="padding:0">${txt} · sensación ${Math.round(c.apparent_temperature)}° · viento ${Math.round(c.wind_speed_10m)} km/h · humedad ${c.relative_humidity_2m}%</div></div></div>
    <div class="estado">Toca un día para ver el tiempo por horas.${diaViaje && !fueraDeRango ? " 📍 = vuestro día en este sitio." : ""}</div>
    ${dias}
    ${mostrar < fechas.length ? `<button class="volver" id="masDias">Ver los ${fechas.length} días ›</button>` : ""}
    <div class="nota">Previsión para el punto del mapa · Fuente: Open-Meteo. Hora local del destino.</div>`;
  $contenido.querySelectorAll(".dia.clic").forEach(el => el.onclick = () => { diaTiempo = el.dataset.f; dibujarTiempo(d); el.scrollIntoView && setTimeout(() => $contenido.querySelector(".dia.sel")?.scrollIntoView({block:"start", behavior:"smooth"}), 30); });
  const md = document.getElementById("masDias"); if(md) md.onclick = () => { verDiasTiempo = 16; dibujarTiempo(d); };
}

/* ---------- aviso por GPS al llegar a una parada del día ---------- */
const PLANIFICADOR = "https://claude.ai/artifact/Qbgh7byxhy38dJQYAEBNZj";
const RADIO_AVISO = 100;           // metros
let vigilancia = null, gpsEstado = "", marcaGps = null, descartados = new Set(), avisoActual = null;
function leerVisitados(){ try{ return JSON.parse(localStorage.getItem("mgv_visitados") || "[]"); }catch(_){ return []; } }
function visitadoLocal(id){ return !!id && leerVisitados().includes(id); }
function guardarVisitadoLocal(id){ try{ const l = leerVisitados(); if(!l.includes(id)){ l.push(id); localStorage.setItem("mgv_visitados", JSON.stringify(l.slice(-500))); } }catch(_){} }
function ponerEstadoGps(t){ gpsEstado = t; const el = document.getElementById("gpsest"); if(el) el.textContent = t; }
function iniciarSeguimiento(){
  if(vigilancia != null || !navigator.geolocation) { if(!navigator.geolocation) ponerEstadoGps("Este navegador no permite usar el GPS."); return; }
  if(!diaVista || !diaVista.p.some(p => p.id && p.lat != null)) return;
  ponerEstadoGps("📡 Activando GPS…");
  vigilancia = navigator.geolocation.watchPosition(pos => {
    const yo = {lat: pos.coords.latitude, lon: pos.coords.longitude}, prec = pos.coords.accuracy || 0;
    if(marcaGps) marcaGps.setLatLng([yo.lat, yo.lon]);
    else marcaGps = L.marker([yo.lat, yo.lon], {icon: L.divIcon({className:"", html:'<div class="yo"></div>', iconSize:[18,18]})}).addTo(mapa);
    if(prec > 150){ ponerEstadoGps(`📡 GPS con poca precisión (${Math.round(prec)} m): esperando mejor señal…`); return; }
    ponerEstadoGps(`📡 GPS activo: te avisaré al llegar a cada parada (a menos de ${RADIO_AVISO} m). Mantén esta pantalla abierta.`);
    comprobarCercania(yo);
  }, err => {
    ponerEstadoGps(err.code === 1 ? "📡 Permiso de ubicación denegado: actívalo en los ajustes del navegador para recibir avisos." : "📡 Sin señal GPS por ahora.");
    if(err.code === 1){ navigator.geolocation.clearWatch(vigilancia); vigilancia = null; }
  }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 30000});
}
function comprobarCercania(yo){
  if(!diaVista || avisoActual) return;
  const cand = diaVista.p.filter(p => p.id && p.lat != null && !p.visitado && !visitadoLocal(p.id) && !descartados.has(p.id))
    .map(p => ({p, m: distancia(yo, p) * 1000})).filter(x => x.m <= RADIO_AVISO).sort((a,b) => a.m - b.m)[0];
  if(cand) mostrarAvisoGps(cand.p, cand.m);
}
function mostrarAvisoGps(p, m){
  avisoActual = p.id;
  const el = document.getElementById("avisoGPS");
  el.innerHTML = `<div style="font-size:13px;color:var(--gris)">📍 Estás a ${Math.round(m)} m de</div><b>${esc(p.nombre)}</b>
    <div class="acciones" style="margin:10px 0 0"><button class="secundario" id="gpsNo">Ahora no</button>
    <a class="primario" id="gpsSi" href="${PLANIFICADOR}#visitar-${encodeURIComponent(p.id)}" target="_blank" rel="noopener">✅ Marcar visitado</a></div>
    <div class="nota" style="margin-top:6px">Se abrirá el Planificador para confirmarlo y que lo vea toda la familia.</div>`;
  el.style.display = "block";
  try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(_){}
  document.getElementById("gpsNo").onclick = () => { descartados.add(p.id); cerrarAvisoGps(); };
  document.getElementById("gpsSi").onclick = () => { guardarVisitadoLocal(p.id); p.visitado = true; setTimeout(() => { cerrarAvisoGps(); if(vista === "dia") pintarDia(); }, 300); };
}
function cerrarAvisoGps(){ document.getElementById("avisoGPS").style.display = "none"; avisoActual = null; }

/* ---------- arranque: parámetros de enlace ---------- */
(function inicio(){
  const p = new URLSearchParams(location.search);
  const lat = parseFloat(p.get("lat")), lon = parseFloat(p.get("lon")), q = p.get("q"), t = p.get("t");
  let dia = null;
  try{ if(p.get("dia")) dia = JSON.parse(p.get("dia")); }catch(_){}
  if(p.get("cerca")){
    // «¿Qué hay cerca?» desde el Planificador: GPS automático; si falla, última posición conocida
    const respaldo = (!isNaN(lat) && !isNaN(lon)) ? {lat, lon, nombre: p.get("ref") || ""} : null;
    if(respaldo) mapa.setView([lat, lon], 14);
    localizarme(respaldo);
  } else if(dia && Array.isArray(dia.p)){
    const num = v => (v === null || v === "" || !isFinite(+v)) ? null : +v;
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(dia.f || ""))) diaViaje = dia.f;
    abrirDia({d: String(dia.d||""), t: String(dia.t||""), x: String(dia.x||""),
      p: dia.p.slice(0, 15).map(a => ({hora:String(a[0]||""), nombre:String(a[1]||"Parada"), nota:String(a[2]||""), lat:num(a[3]), lon:num(a[4]), wiki:String(a[5]||""),
        id: /^[A-Za-z0-9]{1,40}$/.test(String(a[6]||"")) ? String(a[6]) : "", visitado: !!a[7]}))});
  } else if(!isNaN(lat) && !isNaN(lon)){
    irA({lat, lon}, 15);
    if(t){ setTimeout(() => mostrarFicha(t, "es", {lat, lon}), 300); }
  } else if(q){
    document.getElementById("q").value = q; buscarLugar(q);
  } else if(t){
    mostrarFicha(t, "es");
  }
})();
</script>
